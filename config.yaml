heartbeat:
  # written by the server's monitor every 5 minutes, never cached by Cloudflare
  urls:
    - https://www.lexplair.com/__lair/heartbeat.json
    - https://www.trendlair.com/__lair/heartbeat.json
  stale_min: 20

sites:
  - name: Lexplair
    url: https://www.lexplair.com
    pages: [/, /articles, /tools, /store]
  - name: Trendlair
    url: https://www.trendlair.com
    pages: [/]

settings:
  timeout_seconds: 15
  ssl_warn_days: 14
