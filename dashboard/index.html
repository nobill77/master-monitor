<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مراقبة المواقع</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f4f4f5;color:#111;padding:20px;max-width:960px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:20px;font-weight:700}.sub{font-size:12px;color:#888;margin-top:2px}
.btn{padding:8px 16px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px;font-family:inherit}.btn:hover{background:#f0f0f0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.card{background:#fff;border-radius:12px;padding:16px 20px;border:1px solid #e4e4e7}
.card .lbl{font-size:11px;color:#888;margin-bottom:6px;text-transform:uppercase}
.card .big{font-size:32px;font-weight:700}.card .meta{font-size:12px;margin-top:6px}
.ok{color:#16a34a}.warn{color:#d97706}.err{color:#dc2626}
.box{background:#fff;border-radius:12px;border:1px solid #e4e4e7;margin-bottom:16px;overflow:hidden}
.bhead{padding:13px 18px;border-bottom:1px solid #f0f0f0;font-size:14px;font-weight:700;display:flex;justify-content:space-between}
.bhead span{font-size:11px;color:#aaa;font-weight:400;align-self:center}
.tabs{display:flex;background:#fafafa;border-bottom:1px solid #f0f0f0}
.tab{flex:1;padding:10px;font-size:13px;font-weight:500;border:none;background:transparent;cursor:pointer;color:#888;font-family:inherit;border-bottom:2px solid transparent}
.tab.on{color:#2563eb;border-bottom:2px solid #2563eb;background:#fff}
.item{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid #f5f5f5;align-items:flex-start}
.item:last-child{border-bottom:none}
.ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.info{flex:1;min-width:0}
.ttl{font-size:13px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl a{color:#111;text-decoration:none}.ttl a:hover{color:#2563eb;text-decoration:underline}
.desc{font-size:12px;color:#666;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:500}
.tgh{background:#eff6ff;color:#1d4ed8}.tph{background:#f5f3ff;color:#6d28d9}.trd{background:#fff7ed;color:#c2410c}
.tart{background:#f0fdf4;color:#15803d}.ttol{background:#fff7ed;color:#b45309}
.stars{font-size:12px;color:#f59e0b;font-weight:500}
.sec-lbl{font-size:12px;padding:8px 18px;border-bottom:1px solid #f0f0f0;font-weight:600}
.sec-lbl.new{color:#16a34a;background:#f0fdf4}.sec-lbl.old{color:#888;background:#fafafa}
.alert{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#dc2626;display:none}
.alert.show{display:flex;gap:8px;align-items:flex-start}
.fbtn{margin-top:6px;padding:5px 12px;border-radius:6px;background:#dc2626;color:#fff;border:none;font-size:12px;cursor:pointer;font-family:inherit}
.empty{text-align:center;padding:28px;color:#aaa;font-size:13px}
.runs{padding:10px 18px}
.run{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #f5f5f5;font-size:12px}
.run:last-child{border-bottom:none}.rn{flex:1;color:#555}.rt{color:#aaa}
.new-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;margin-left:4px;vertical-align:middle}
#sp{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:16px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="top">
  <div><h1>📊 مراقبة المواقع</h1><p class="sub" id="sub">—</p></div>
  <div style="display:flex;gap:8px">
    <button class="btn" onclick="showSettings()">⚙️ إعدادات</button>
    <button class="btn" onclick="init()">🔄 تحديث</button>
  </div>
</div>

<div id="sp">
  <p style="font-size:14px;font-weight:600;margin-bottom:10px">🔑 GitHub Token</p>
  <input id="gh-inp" type="password" placeholder="ghp_..." style="width:100%;border:1px solid #ddd;border-radius:8px;padding:8px;font-size:13px;margin-bottom:8px;direction:ltr">
  <button onclick="saveSettings()" style="padding:7px 16px;border-radius:8px;background:#2563eb;color:#fff;border:none;cursor:pointer;font-size:13px">حفظ</button>
</div>

<div class="alert" id="alx">
  <div>⚠️ <strong>Lexplair Brain وقف!</strong> <span id="alx-msg"></span>
  <br><button class="fbtn" onclick="triggerBrain()">▶ تشغيل Brain دلوقتي</button></div>
</div>

<div class="grid">
  <div class="card"><div class="lbl">🚀 Trendlair — النهارده</div><div class="big" id="te-n">—</div><div class="meta" id="te-m">—</div></div>
  <div class="card"><div class="lbl">📚 Lexplair — محتوى جديد</div><div class="big" id="lx-n">—</div><div class="meta" id="lx-m">—</div></div>
</div>

<div class="box">
  <div class="bhead">🚀 Trendlair — اللي اترفع <span id="te-rt">—</span></div>
  <div class="tabs">
    <button class="tab on" onclick="swTab(this,'github')">⭐ GitHub</button>
    <button class="tab" onclick="swTab(this,'ph')">🚀 Product Hunt</button>
    <button class="tab" onclick="swTab(this,'hn')">🔥 HackerNews</button>
  </div>
  <div id="te-c"><div class="empty">جاري...</div></div>
  <div style="padding:8px 18px;border-top:1px solid #f0f0f0;font-size:11px;color:#aaa">آخر 5 runs</div>
  <div class="runs" id="te-r"></div>
</div>

<div class="box">
  <div class="bhead">📚 Lexplair — المقالات والأدوات <span id="lx-rt">—</span></div>
  <div id="lx-c"><div class="empty">جاري...</div></div>
  <div style="padding:8px 18px;border-top:1px solid #f0f0f0;font-size:11px;color:#aaa">آخر 5 runs</div>
  <div class="runs" id="lx-r"></div>
</div>

<script>
var GH=localStorage.getItem('gh')||'';
var SB='https://hefcrjxqsokcmwqytaws.supabase.co';
var SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlZmNyanhxc29rY213cXl0YXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDkwNTksImV4cCI6MjA5NTMyNTA1OX0.AVHBKTyOokpl7zDuCEr3bHfYXHvB8AvZmBhliS5FrA4';
var items=[];var curTab='github';

function ago(d){var s=(Date.now()-new Date(d))/1000;if(s<3600)return Math.floor(s/60)+' دقيقة';if(s<86400)return Math.floor(s/3600)+' ساعة';return Math.floor(s/86400)+' يوم';}
function isToday(d){var n=new Date(),t=new Date(d);return t.toDateString()===n.toDateString();}
function isNew(d){return(Date.now()-new Date(d))<172800000;}
function gh(p){return fetch('https://api.github.com'+p,{headers:{'Authorization':'token '+GH}}).then(function(r){return r.json();});}

function init(){
  var saved=localStorage.getItem('gh');
  if(!saved){document.getElementById('sub').innerHTML='<span style="color:red">محتاج GitHub Token — اضغط ⚙️ إعدادات</span>';return;}
  GH=saved;
  document.getElementById('sub').textContent='جاري...';
  Promise.all([loadTe(),loadLx()]).then(function(){
    document.getElementById('sub').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-EG');
  });
}

function loadTe(){
  return fetch(SB+'/rest/v1/items?select=*&order=created_at.desc&limit=200',{
    headers:{'apikey':SK,'Authorization':'Bearer '+SK}
  }).then(function(r){return r.ok?r.json():[];}).then(function(d){
    items=Array.isArray(d)?d:[];
    var today=items.filter(function(i){return isToday(i.created_at);});
    document.getElementById('te-n').textContent=today.length||items.length||'—';
    document.getElementById('te-m').innerHTML=items.length===0?'<span class="err">❌ لا بيانات</span>':today.length>0?'<span class="ok">✅ اترفع النهارده</span>':'<span class="warn">⚠️ منذ '+ago(items[0].created_at)+'</span>';
    renderTab();
  }).catch(function(){
    document.getElementById('te-n').textContent='—';
    document.getElementById('te-m').innerHTML='<span class="err">❌ خطأ اتصال</span>';
  }).then(function(){
    return gh('/repos/nobill77/trendlair/actions/runs?per_page=5');
  }).then(function(d){
    var rl=d.workflow_runs||[];
    if(rl[0])document.getElementById('te-rt').textContent='آخر run: منذ '+ago(rl[0].updated_at);
    document.getElementById('te-r').innerHTML=rl.map(function(r){
      return '<div class="run"><span>'+(r.conclusion==='success'?'✅':'❌')+'</span><span class="rn">#'+r.run_number+' '+r.name+'</span><span class="rt">منذ '+ago(r.updated_at)+'</span></div>';
    }).join('');
  }).catch(function(){});
}

function loadLx(){
  return gh('/repos/nobill77/Lexplair/commits?per_page=50').then(function(commits){
    var brain=commits.filter(function(c){
      var m=c.commit.message;
      return m.includes('[ARTICLE]')||m.includes('[TOOL]')||m.includes('Brain:')||m.includes('Brain new content')||m.includes('content: Brain');
    });
    var daysSince=brain[0]?Math.floor((Date.now()-new Date(brain[0].commit.author.date))/86400000):999;
    var newI=brain.filter(function(c){return isNew(c.commit.author.date);});
    document.getElementById('lx-n').textContent=newI.length>0?newI.length:brain.length;
    document.getElementById('lx-m').innerHTML=daysSince===0?'<span class="ok">✅ نزل النهارده</span>':'<span class="'+(daysSince>3?'err':'warn')+'">⚠️ منذ '+daysSince+' أيام</span>';
    if(daysSince>3){document.getElementById('alx').classList.add('show');document.getElementById('alx-msg').textContent='آخر محتوى منذ '+daysSince+' أيام.';}
    else{document.getElementById('alx').classList.remove('show');}

    return Promise.all(brain.slice(0,15).map(function(c){
      return gh('/repos/nobill77/Lexplair/commits/'+c.sha).catch(function(){return {};});
    })).then(function(dets){
      dets.forEach(function(d,i){if(d.files)brain[i]._files=d.files;});
      var nI=brain.filter(function(c){return isNew(c.commit.author.date);});
      var oI=brain.filter(function(c){return !isNew(c.commit.author.date);});
      var html='';
      if(nI.length){html+='<div class="sec-lbl new">✅ جديد — آخر 48 ساعة ('+nI.length+' عنصر)</div>';html+=nI.map(renderLx).join('');}
      if(oI.length){html+='<div class="sec-lbl old">السابق</div>';html+=oI.slice(0,8).map(renderLx).join('');}
      document.getElementById('lx-c').innerHTML=html||'<div class="empty">لا يوجد محتوى</div>';
    });
  }).then(function(){
    return gh('/repos/nobill77/Lexplair/actions/runs?per_page=5');
  }).then(function(d){
    var rl=d.workflow_runs||[];
    if(rl[0])document.getElementById('lx-rt').textContent='آخر run: منذ '+ago(rl[0].updated_at);
    document.getElementById('lx-r').innerHTML=rl.map(function(r){
      return '<div class="run"><span>'+(r.conclusion==='success'?'✅':'❌')+'</span><span class="rn">#'+r.run_number+' '+r.name+'</span><span class="rt">منذ '+ago(r.updated_at)+'</span></div>';
    }).join('');
  }).catch(function(){});
}

function renderLx(c){
  var msg=c.commit.message.split('\n')[0];
  var isArt=msg.includes('[ARTICLE]')||msg.includes('article');
  var isTool=msg.includes('[TOOL]')||msg.includes('tool');
  var name=msg.replace('🤖','').replace('[ARTICLE]','').replace('[TOOL]','').replace(/\(score:[^)]+\)/g,'').trim();
  if(c._files&&c._files.length>0){
    var f=c._files[0];
    var fn=f.filename.split('/').pop().replace('.md','').replace('.html','').replace(/-/g,' ');
    name=fn.charAt(0).toUpperCase()+fn.slice(1);
    isArt=f.filename.includes('articles');
    isTool=f.filename.includes('tools');
  }
  var d=new Date(c.commit.author.date);
  var dot=isNew(c.commit.author.date)?'<span class="new-dot"></span>':'';
  var bg=isArt?'#f0fdf4':isTool?'#fff7ed':'#f5f5f5';
  var icon=isArt?'📄':isTool?'🛠️':'🔄';
  var tagCls=isArt?'tart':isTool?'ttol':'tgh';
  var tagName=isArt?'مقال':isTool?'أداة':'تحديث';
  return '<div class="item"><div class="ico" style="background:'+bg+'">'+icon+'</div><div class="info"><div class="ttl">'+dot+name+'</div><div class="meta2"><span class="tag '+tagCls+'">'+tagName+'</span><span style="font-size:11px;color:#aaa">منذ '+ago(c.commit.author.date)+' · '+d.toLocaleDateString('ar-EG')+'</span></div></div></div>';
}

function swTab(btn,tab){curTab=tab;document.querySelectorAll('.tab').forEach(function(b){b.className='tab';});btn.className='tab on';renderTab();}

function renderTab(){
  var f=items.filter(function(i){
    if(curTab==='github')return i.source==='github'||i.type==='repo';
    if(curTab==='ph')return i.source==='product_hunt'||i.type==='tool'||(i.source==='producthunt');
    if(curTab==='hn')return i.source==='hackernews'||i.type==='article'||i.source==='reddit';
    return false;
  });
  // If no items for this tab, show all items
  if(!f.length && items.length) f=items.slice(0,20);
  var el=document.getElementById('te-c');
  if(!f.length){el.innerHTML='<div class="empty">لا بيانات — افتح <a href="https://trendlair.com" target="_blank" style="color:#2563eb">trendlair.com</a></div>';return;}
  var icons={github:'⭐',ph:'🚀',hn:'🔥'};
  var bgs={github:'#eff6ff',ph:'#f5f3ff',hn:'#fff7ed'};
  var tags={github:'tgh',ph:'tph',hn:'trd'};
  el.innerHTML=f.slice(0,20).map(function(i){
    var dot=isNew(i.created_at)?'<span class="new-dot"></span>':'';
    return '<div class="item"><div class="ico" style="background:'+bgs[curTab]+'">'+icons[curTab]+'</div><div class="info"><div class="ttl">'+dot+'<a href="'+(i.url||'#')+'" target="_blank">'+(i.title||'—')+'</a></div>'+(i.description?'<div class="desc">'+i.description+'</div>':'')+'<div class="meta2">'+(i.stars?'<span class="stars">⭐ '+Number(i.stars).toLocaleString()+'</span>':'')+'<span class="tag '+tags[curTab]+'">'+curTab+'</span><span style="font-size:11px;color:#aaa">منذ '+ago(i.created_at)+'</span></div></div></div>';
  }).join('');
}

function triggerBrain(){
  var b=document.querySelector('.fbtn');b.textContent='جاري...';b.disabled=true;
  fetch('https://api.github.com/repos/nobill77/Lexplair/actions/workflows/273732300/dispatches',{
    method:'POST',headers:{'Authorization':'token '+GH,'Content-Type':'application/json'},
    body:JSON.stringify({ref:'main'})
  }).then(function(r){b.textContent=r.status===204?'✅ تم!':'❌ فشل';if(r.status!==204)b.disabled=false;});
}

function showSettings(){document.getElementById('sp').style.display='block';}
function saveSettings(){
  var t=document.getElementById('gh-inp').value.trim();
  if(t){localStorage.setItem('gh',t);GH=t;document.getElementById('sp').style.display='none';init();}
}

init();

</script>
</body>
</html>
